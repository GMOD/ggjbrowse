name: Bundle

# inst/js/jbrowse-tables.js is @jbrowse/tables built from jbrowse-components,
# committed so installing needs no JavaScript toolchain. Its first line names
# the commit it came from.
#
# Two jobs keep it honest, since a change there fires no event here:
#   canary  rebuilds against jbrowse-components main nightly and runs the
#           tests on the result, committing nothing. Red means main broke
#           the contract before any release did.
#   release rebuilds from each new jbrowse-components release tag, and
#           commits the bundle to main once R CMD check passes on it. A
#           failing check leaves main alone and fails the run, so the next
#           run tries again.
# jbrowse-components can also start the release job the moment it tags, with
# a repository_dispatch of type jbrowse-release.
on:
  schedule:
    - cron: '23 6 * * *'
  repository_dispatch:
    types: [jbrowse-release]
  workflow_dispatch:
    inputs:
      ref:
        description: 'jbrowse-components tag to take, the latest release by default'
        required: false

concurrency: bundle

jobs:
  canary:
    name: Tests pass on a bundle from jbrowse-components main
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ggjbrowse
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: GMOD/jbrowse-components
          path: jbrowse-components
      - uses: ./ggjbrowse/.github/actions/toolchains
      - run: pnpm install --frozen-lockfile
        working-directory: jbrowse-components
      - run: scripts/check-against-jbrowse.sh
        working-directory: ggjbrowse

  release:
    name: Take the latest jbrowse-components release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ggjbrowse
      - name: Find the release to take
        id: release
        working-directory: ggjbrowse
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ inputs.ref || github.event.client_payload.ref }}
        run: |
          wanted=${INPUT_REF:-$(gh api repos/GMOD/jbrowse-components/releases/latest --jq .tag_name)}
          built=$(head -1 inst/js/jbrowse-tables.js)
          echo "wanted $wanted; bundle says: $built"
          echo "ref=$wanted" >> "$GITHUB_OUTPUT"
          case "$built" in *"($wanted)"*) ;; *) echo "update=true" >> "$GITHUB_OUTPUT" ;; esac
      - if: steps.release.outputs.update
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: GMOD/jbrowse-components
          ref: ${{ steps.release.outputs.ref }}
          path: jbrowse-components
      - name: Skip a release older than @jbrowse/tables
        id: has-tables
        if: steps.release.outputs.update
        run: |
          if [ -f jbrowse-components/packages/tables/package.json ]; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::${{ steps.release.outputs.ref }} predates packages/tables; nothing to take"
          fi
      - if: steps.has-tables.outputs.yes
        uses: ./ggjbrowse/.github/actions/toolchains
      - if: steps.has-tables.outputs.yes
        run: pnpm install --frozen-lockfile
        working-directory: jbrowse-components
      - if: steps.has-tables.outputs.yes
        run: scripts/build-js.sh
        working-directory: ggjbrowse
        env:
          JBROWSE_REF: ${{ steps.release.outputs.ref }}
      - if: steps.has-tables.outputs.yes
        uses: r-lib/actions/check-r-package@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          working-directory: ggjbrowse
          args: 'c("--no-manual")'
          error-on: '"note"'
      - if: steps.has-tables.outputs.yes
        name: Commit to main
        working-directory: ggjbrowse
        env:
          REF: ${{ steps.release.outputs.ref }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inst/js
          git commit -m "Bundle @jbrowse/tables from jbrowse-components $REF"
          git push origin HEAD:main
