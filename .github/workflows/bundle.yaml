name: Bundle

# inst/js/jbrowse-tables.js is @jbrowse/tables' dist/jbrowse-tables.js,
# committed so installing needs no JavaScript toolchain; its first line names
# the release. This takes each new release from npm into main once R CMD check
# passes on it, then asks R-CMD-check for the full platform matrix, since a
# push made with the workflow's own token starts no workflow. A failing check
# leaves main alone and fails the run, so the next run tries again.
#
# A break before a release is jbrowse-components' to see: its downstream
# canary runs scripts/check-against-jbrowse.sh against its main nightly.
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: '@jbrowse/tables version, the newer of latest and next by default'
        required: false

concurrency: bundle

jobs:
  release:
    name: Take the latest @jbrowse/tables release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Find the release to take
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          wanted=${INPUT_VERSION:-$(scripts/newest-release.sh 2>/dev/null || true)}
          built=$(sed -n '1s|^// @jbrowse/tables \([^ ]*\) .*|\1|p' inst/js/jbrowse-tables.js)
          if [ -z "$wanted" ]; then
            echo "::notice::@jbrowse/tables is not on npm yet"
          elif [ "$wanted" != "$built" ]; then
            echo "taking $wanted over $built"
            echo "version=$wanted" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.release.outputs.version
        run: scripts/take-release.sh "$VERSION"
        env:
          VERSION: ${{ steps.release.outputs.version }}
      - if: steps.release.outputs.version
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          use-public-rspm: true
      - if: steps.release.outputs.version
        uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - if: steps.release.outputs.version
        uses: r-lib/actions/check-r-package@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          args: 'c("--no-manual")'
          error-on: '"note"'
      - if: steps.release.outputs.version
        name: Commit to main and check every platform
        env:
          VERSION: ${{ steps.release.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inst/js
          git commit -m "Bundle @jbrowse/tables $VERSION"
          git push origin HEAD:main
          gh workflow run R-CMD-check.yaml --ref main
